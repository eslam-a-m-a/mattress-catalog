<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيت المراتب</title><style>body{font-family:Arial;margin:0;background:#f6f6f6;color:#222}header{background:#111;color:#fff;padding:20px;text-align:center}main{max-width:1100px;margin:auto;padding:20px}.controls{display:flex;gap:10px;margin-bottom:20px}.controls>*{padding:12px;border:1px solid #ddd;border-radius:8px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}.card img{width:100%;height:220px;object-fit:cover}.info{padding:14px}.price{font-size:20px;font-weight:bold}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f7e8;color:#16801d}.off{background:#eee;color:#777}</style></head><body><header><h1>بيت المراتب</h1><div>الكتالوج الإلكتروني</div></header><main><div class="controls"><input id="search" placeholder="ابحث عن صنف..."><select id="category"><option value="">كل التصنيفات</option></select></div><div id="status">جاري التحميل...</div><div id="grid" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let products=[];const grid=document.getElementById('grid'),status=document.getElementById('status'),search=document.getElementById('search'),category=document.getElementById('category');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){const r=await db.from('products').select('*').order('sort_order').order('name');if(r.error){status.textContent=r.error.message;return}products=r.data||[];[...new Set(products.map(x=>x.category).filter(Boolean))].forEach(c=>category.insertAdjacentHTML('beforeend',`<option value="${esc(c)}">${esc(c)}</option>`));render()}function render(){let q=search.value.toLowerCase(),c=category.value;let a=products.filter(p=>(!q||[p.name,p.code,p.description,p.category].join(' ').toLowerCase().includes(q))&&(!c||p.category===c));status.textContent='عدد المنتجات: '+a.length;grid.innerHTML=a.map(p=>`<article class="card">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:''}<div class="info"><h3>${esc(p.name)}</h3><div>${esc(p.description)}</div><p class="price">${p.price??''} ريال</p><span class="badge ${p.available?'':'off'}">${p.available?'متوفر':'غير متوفر'}</span></div></article>`).join('')}search.oninput=render;category.onchange=render;load();</script></body></html>
