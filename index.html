<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>شركة بيت المراتب للمفروشات</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f4f8fc;
color:#1d2939;
}

header{
background:linear-gradient(135deg,#0756a8,#1689e5);
color:#fff;
padding:25px 18px;
}

.header-inner{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.logo h1{
margin:0;
font-size:28px;
}

.logo p{
margin:7px 0 0;
opacity:.9;
}

.whatsapp{
background:#fff;
color:#0756a8;
text-decoration:none;
padding:12px 18px;
border-radius:10px;
font-weight:bold;
}

main{
max-width:1200px;
margin:auto;
padding:20px;
}

/* الإعلانات */

.ads{
margin-bottom:25px;
}

.ad{
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:0 4px 18px #0001;
display:flex;
min-height:230px;
}

.ad-image{
width:45%;
object-fit:cover;
}

.ad-content{
padding:28px;
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
}

.ad-content h2{
color:#0756a8;
font-size:28px;
margin:0 0 10px;
}

.ad-content p{
font-size:17px;
line-height:1.7;
}

.ad-button{
display:inline-block;
width:max-content;
background:#0756a8;
color:#fff;
text-decoration:none;
padding:12px 20px;
border-radius:9px;
font-weight:bold;
}

/* البحث */

.controls{
background:#fff;
padding:15px;
border-radius:14px;
box-shadow:0 2px 10px #0001;
display:flex;
gap:10px;
margin-bottom:20px;
}

.controls input,
.controls select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
font:inherit;
}

.status{
margin-bottom:15px;
color:#667085;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:18px;
}

.card{
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 12px #0001;
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
}

.card img{
width:100%;
height:230px;
object-fit:cover;
background:#eef3f8;
}

.no-image{
height:230px;
display:flex;
align-items:center;
justify-content:center;
background:#eef3f8;
color:#98a2b3;
}

.info{
padding:16px;
}

.info h3{
margin:0 0 8px;
font-size:19px;
}

.category{
color:#667085;
font-size:14px;
margin-bottom:8px;
}

.description{
font-size:14px;
line-height:1.6;
color:#475467;
min-height:40px;
}

.price{
font-size:21px;
font-weight:bold;
color:#0756a8;
margin:12px 0;
}

.badge{
display:inline-block;
padding:6px 10px;
border-radius:20px;
font-size:13px;
background:#e8f7e8;
color:#16801d;
}

.off{
background:#eee;
color:#777;
}

.empty{
background:#fff;
padding:40px;
text-align:center;
border-radius:15px;
color:#667085;
}

footer{
margin-top:40px;
background:#073b73;
color:#fff;
padding:25px 20px;
text-align:center;
}

footer p{
margin:7px;
}

.footer-whatsapp{
color:#fff;
font-weight:bold;
}

@media(max-width:700px){

.header-inner{
flex-direction:column;
text-align:center;
}

.logo h1{
font-size:23px;
}

.ad{
display:block;
}

.ad-image{
width:100%;
height:210px;
}

.ad-content{
padding:20px;
}

.ad-content h2{
font-size:23px;
}

.controls{
flex-direction:column;
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.card img,
.no-image{
height:170px;
}

.info{
padding:11px;
}

.info h3{
font-size:16px;
}

.price{
font-size:18px;
}

}

@media(max-width:420px){

.grid{
grid-template-columns:1fr;
}

.card img,
.no-image{
height:220px;
}

}
</style>

</head>

<body>

<header>

<div class="header-inner">

<div class="logo">

<h1>شركة بيت المراتب للمفروشات</h1>

<p>الكتالوج الإلكتروني</p>

</div>

<a
class="whatsapp"
href="https://wa.me/966546510165"
target="_blank">

تواصل معنا عبر واتساب

</a>

</div>

</header>


<main>

<section class="ads">

<div id="adsContainer"></div>

</section>


<div class="controls">

<input
id="search"
placeholder="ابحث عن منتج أو كود...">

<select id="category">

<option value="">
كل التصنيفات
</option>

</select>

</div>


<div
id="status"
class="status">

جاري تحميل المنتجات...

</div>


<div
id="grid"
class="grid">
</div>

</main>


<footer>

<p>
شركة بيت المراتب للمفروشات
</p>

<p>
للتواصل:
<a
class="footer-whatsapp"
href="https://wa.me/966546510165"
target="_blank">
0546510165
</a>
</p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* اتصال Supabase مباشرة */

const SUPABASE_URL =
"https://wmiszhoahvfsbmedjrbm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_fFclLm6Z2fdUTYxD_AAC5w_icPdd_n5";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let products=[];
let ads=[];


const grid =
document.getElementById('grid');

const status =
document.getElementById('status');

const search =
document.getElementById('search');

const category =
document.getElementById('category');

const adsContainer =
document.getElementById('adsContainer');


/* حماية النصوص */

function esc(v){

return String(v ?? '')
.replace(
/[&<>"']/g,
m=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[m])
);

}


/* تحميل المنتجات */

async function loadProducts(){

status.textContent =
'جاري تحميل المنتجات...';


try{

const r =
await db
.from('products')
.select('*')
.order(
'sort_order',
{
ascending:true
}
)
.order(
'name',
{
ascending:true
}
);


console.log(
'PRODUCT RESULT:',
r
);


if(r.error){

status.textContent =
'خطأ في تحميل المنتجات: ' +
r.error.message;

return;

}


products =
r.data || [];


/* التصنيفات */

category.innerHTML =
'<option value="">كل التصنيفات</option>';


[
...new Set(
products
.map(x=>x.category)
.filter(Boolean)
)
]
.forEach(c=>{

category.insertAdjacentHTML(
'beforeend',

`
<option value="${esc(c)}">
${esc(c)}
</option>
`

);

});


render();


}catch(error){

console.error(error);

status.textContent =
'حدث خطأ أثناء تحميل المنتجات';

}

}


/* عرض المنتجات */

function render(){

const q =
search.value
.toLowerCase()
.trim();

const c =
category.value;


const result =
products.filter(p=>{

const text =
[
p.name,
p.code,
p.description,
p.category
]
.join(' ')
.toLowerCase();


return
(!q || text.includes(q))
&&
(!c || p.category===c);

});


status.textContent =
'عدد المنتجات: ' +
result.length;


if(!result.length){

grid.innerHTML = `
<div class="empty">
لا توجد منتجات مطابقة للبحث
</div>
`;

return;

}


grid.innerHTML =
result.map(p=>`

<article class="card">

${
p.image_url

?

`
<img
src="${esc(p.image_url)}"
alt="${esc(p.name)}">
`

:

`
<div class="no-image">
لا توجد صورة
</div>
`
}

<div class="info">

<h3>
${esc(p.name)}
</h3>


${
p.code
?
`
<div class="category">
كود المنتج: ${esc(p.code)}
</div>
`
:
''
}


${
p.category
?
`
<div class="category">
التصنيف: ${esc(p.category)}
</div>
`
:
''
}


<div class="description">
${esc(p.description || '')}
</div>


${
p.price !== null &&
p.price !== undefined &&
p.price !== ''

?

`
<div class="price">
${Number(p.price).toLocaleString('ar-SA')}
ريال
</div>
`

:

''
}


<span
class="badge ${p.available?'':'off'}">

${p.available
?
'متوفر'
:
'غير متوفر'}

</span>

</div>

</article>

`).join('');

}


/* تحميل الإعلانات */

async function loadAds(){

try{

const r =
await db
.from('ads')
.select('*')
.eq(
'active',
true
)
.order(
'sort_order',
{
ascending:true
}
)
.order(
'id',
{
ascending:false
}
);


console.log(
'ADS RESULT:',
r
);


if(r.error){

console.error(
r.error
);

return;

}


ads =
r.data || [];

renderAds();


}catch(error){

console.error(error);

}

}


/* عرض الإعلانات */

function renderAds(){

if(!ads.length){

adsContainer.innerHTML='';

return;

}


adsContainer.innerHTML =
ads.map(ad=>`

<div class="ad">

${
ad.image_url

?

`
<img
class="ad-image"
src="${esc(ad.image_url)}"
alt="${esc(ad.title || '')}">
`

:

''
}


<div class="ad-content">

<h2>
${esc(ad.title || '')}
</h2>


${
ad.description
?

`
<p>
${esc(ad.description)}
</p>
`

:

''
}


${
ad.button_url
?

`
<a
class="ad-button"
href="${esc(ad.button_url)}"
target="_blank">

${esc(
ad.button_text ||
'اعرف المزيد'
)}

</a>
`

:

''
}

</div>

</div>

`).join('');

}


search.oninput=render;

category.onchange=render;


/* التشغيل */

loadProducts();

loadAds();

</script>

</body>

</html>
