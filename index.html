<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كتالوج المراتب</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17223d}
header{background:#024e4c;color:#fff;padding:12px;font-size:24px;font-weight:bold;text-align:center}
.wrap{max-width:1100px;margin:auto;padding:20px}
.item{background:#fff;padding:15px;margin:10px 0;border-radius:8px;box-shadow:0 0 5px #ccc}
.item img{width:100%;max-width:300px;border-radius:8px;margin-bottom:10px}
select{padding:10px;font-size:16px;margin:10px 0;width:100%}
</style>
</head>

<body>

<header>كتالوج المراتب</header>

<div class="wrap">

    <select id="filter">
        <option value="">اختر نوع المرتبة</option>
        <option value="سوست">سوست</option>
        <option value="اسفنج">اسفنج</option>
        <option value="طبي">طبي</option>
    </select>

    <div id="products"></div>

</div>

<!-- تحميل إعدادات Supabase -->
<script src="config.js"></script>

<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// تحميل المنتجات
async function loadProducts(type = "") {
    let query = client.from("products").select("*").order("sort", { ascending: true });

    if (type) query = query.eq("type", type);

    const { data, error } = await query;

    const box = document.getElementById("products");
    box.innerHTML = "";

    if (error || !data.length) {
        box.innerHTML = "<p>لا يوجد منتجات</p>";
        return;
    }

    data.forEach(item => {
        box.innerHTML += `
            <div class="item">
                <img src="${item.image}">
                <h3>${item.name}</h3>
                <p>${item.description}</p>
                <p><strong>السعر:</strong> ${item.price}</p>
            </div>
        `;
    });
}

// عند تغيير الفلتر
document.getElementById("filter").onchange = (e) => {
    loadProducts(e.target.value);
};

// تحميل أولي
loadProducts();
</script>

</body>
</html>
