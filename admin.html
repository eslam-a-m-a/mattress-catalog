<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم شركة بيت المراتب للمفروشات</title>

<style>
body{
font-family:Arial,Tahoma,sans-serif;
background:#f4f7fb;
margin:0;
color:#222;
}

.wrap{
max-width:1000px;
margin:auto;
padding:20px;
}

h1{
color:#0756a8;
}

.box{
background:white;
padding:20px;
border-radius:14px;
margin-bottom:18px;
box-shadow:0 2px 12px #0001;
}

input,textarea,button{
font:inherit;
padding:11px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

input,textarea{
width:100%;
margin:5px 0 10px;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
background:#0756a8;
color:white;
border:0;
margin:4px;
cursor:pointer;
}

.danger{
background:#b00020;
}

.green{
background:#159447;
}

.hidden{
display:none;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
border-top:1px solid #eee;
padding:12px 0;
}

.item-info{
flex:1;
}

.item-image{
width:70px;
height:55px;
object-fit:cover;
border-radius:7px;
margin-left:10px;
vertical-align:middle;
}

.item-actions{
white-space:nowrap;
}

.section-title{
color:#0756a8;
border-bottom:2px solid #e6edf5;
padding-bottom:10px;
}

.checkbox{
display:flex;
align-items:center;
gap:8px;
margin:10px 0;
}

.checkbox input{
width:auto;
margin:0;
}

.msg{
margin-top:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="wrap">

<h1>
لوحة تحكم شركة بيت المراتب للمفروشات
</h1>

<!-- تسجيل الدخول -->

<div id="login" class="box">

<h2>تسجيل الدخول</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني">

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button id="loginBtn">
دخول
</button>

<div id="loginMsg"></div>

</div>


<!-- لوحة التحكم -->

<div id="app" class="hidden">

<button id="logout">
تسجيل الخروج
</button>


<!-- المنتجات -->

<div class="box">

<h2 class="section-title">
إدارة المنتجات
</h2>

<h3 id="productTitle">
إضافة منتج
</h3>

<input id="code" placeholder="كود المنتج">

<input id="name" placeholder="اسم المنتج">

<input id="category" placeholder="التصنيف">

<input
id="price"
type="number"
step="0.01"
placeholder="السعر">

<textarea
id="description"
placeholder="الوصف"></textarea>

<label class="checkbox">

<input
id="available"
type="checkbox"
checked>

متوفر

</label>

<input
id="sort"
type="number"
placeholder="الترتيب">

<input
id="image"
type="file"
accept="image/*">

<button id="saveProduct">
حفظ المنتج
</button>

<button
id="cancelProduct"
class="hidden">
إلغاء
</button>

<div
id="productMsg"
class="msg">
</div>

</div>


<!-- قائمة المنتجات -->

<div class="box">

<h2 class="section-title">
المنتجات الحالية
</h2>

<div id="productList">
جاري التحميل...
</div>

</div>


<!-- الإعلانات -->

<div class="box">

<h2 class="section-title">
إدارة الإعلانات
</h2>

<h3 id="adTitle">
إضافة إعلان
</h3>

<input
id="adName"
placeholder="عنوان الإعلان">

<textarea
id="adDescription"
placeholder="وصف الإعلان"></textarea>

<input
id="adButtonText"
placeholder="نص الزر مثال: شاهد العرض">

<input
id="adButtonUrl"
placeholder="رابط الزر">

<input
id="adSort"
type="number"
placeholder="ترتيب الإعلان">

<label class="checkbox">

<input
id="adActive"
type="checkbox"
checked>

الإعلان فعال

</label>

<input
id="adImage"
type="file"
accept="image/*">

<button
id="saveAd"
class="green">
حفظ الإعلان
</button>

<button
id="cancelAd"
class="hidden">
إلغاء
</button>

<div
id="adMsg"
class="msg">
</div>

</div>


<!-- قائمة الإعلانات -->

<div class="box">

<h2 class="section-title">
الإعلانات الحالية
</h2>

<div id="adList">
جاري التحميل...
</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script>

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let editingProduct = null;
let editingAd = null;

let products = [];
let ads = [];

const $ =
id => document.getElementById(id);


/* تسجيل الدخول */

async function init(){

const r =
await db.auth.getSession();

show(!!r.data.session);

if(r.data.session){

loadProducts();
loadAds();

}

}


function show(on){

$('login')
.classList.toggle('hidden',on);

$('app')
.classList.toggle('hidden',!on);

}


$('loginBtn').onclick =
async()=>{

const email =
$('email').value.trim();

const password =
$('password').value;

$('loginMsg').textContent =
'جاري تسجيل الدخول...';

try{

const {error} =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){

$('loginMsg').textContent =
error.message;

return;

}

$('loginMsg').textContent =
'تم تسجيل الدخول';

show(true);

loadProducts();
loadAds();

}catch(e){

$('loginMsg').textContent =
e.message;

}

};


$('logout').onclick =
async()=>{

await db.auth.signOut();

show(false);

};


/* رفع الصور */

async function uploadImage(file){

if(!file){
return null;
}

const ext =
(file.name.split('.').pop() || 'jpg')
.toLowerCase();

const path =
crypto.randomUUID() + '.' + ext;

const r =
await db.storage
.from('product-images')
.upload(path,file);

if(r.error){
throw r.error;
}

return db.storage
.from('product-images')
.getPublicUrl(path)
.data.publicUrl;

}


/* =========================
   المنتجات
========================= */

$('saveProduct').onclick =
async()=>{

try{

const payload = {

code:$('code').value.trim(),

name:$('name').value.trim(),

category:$('category').value.trim(),

description:$('description').value.trim(),

price:$('price').value
? Number($('price').value)
:null,

available:$('available').checked,

sort_order:
Number($('sort').value || 0)

};

const file =
$('image').files[0];

if(file){

payload.image_url =
await uploadImage(file);

}

let r;

if(editingProduct){

r =
await db
.from('products')
.update(payload)
.eq('id',editingProduct);

}else{

r =
await db
.from('products')
.insert(payload);

}

if(r.error){

$('productMsg').textContent =
r.error.message;

return;

}

$('productMsg').textContent =
'تم حفظ المنتج بنجاح';

resetProduct();

loadProducts();

}catch(e){

$('productMsg').textContent =
e.message;

}

};


async function loadProducts(){

const r =
await db
.from('products')
.select('*')
.order('sort_order')
.order('name');

if(r.error){

$('productList').textContent =
r.error.message;

return;

}

products =
r.data || [];

$('productList').innerHTML =
products.map(p=>`

<div class="item">

<div class="item-info">

${
p.image_url
?
`
<img
class="item-image"
src="${esc(p.image_url)}">
`
:''
}

<b>
${esc(p.name)}
</b>

<br>

<small>
${esc(p.category || '')}
-
${p.available?'متوفر':'غير متوفر'}
</small>

</div>

<div class="item-actions">

<button
onclick="editProduct(${p.id})">
تعديل
</button>

<button
class="danger"
onclick="deleteProduct(${p.id})">
حذف
</button>

</div>

</div>

`).join('')
|| 'لا توجد منتجات';

}


window.editProduct =
id=>{

const p =
products.find(x=>x.id == id);

if(!p){
return;
}

editingProduct = id;

$('productTitle').textContent =
'تعديل المنتج';

$('code').value =
p.code || '';

$('name').value =
p.name || '';

$('category').value =
p.category || '';

$('price').value =
p.price ?? '';

$('description').value =
p.description || '';

$('available').checked =
!!p.available;

$('sort').value =
p.sort_order || 0;

$('cancelProduct')
.classList.remove('hidden');

};


window.deleteProduct =
async id=>{

if(!confirm('هل تريد حذف المنتج؟')){
return;
}

const r =
await db
.from('products')
.delete()
.eq('id',id);

if(r.error){

alert(r.error.message);

return;

}

loadProducts();

};


function resetProduct(){

editingProduct = null;

$('productTitle').textContent =
'إضافة منتج';

[
'code',
'name',
'category',
'price',
'description',
'sort'
]
.forEach(id=>{
$(id).value = '';
});

$('available').checked = true;

$('image').value = '';

$('cancelProduct')
.classList.add('hidden');

};


$('cancelProduct').onclick =
resetProduct;


/* =========================
   الإعلانات
========================= */

$('saveAd').onclick =
async()=>{

try{

const payload = {

title:
$('adName').value.trim(),

description:
$('adDescription').value.trim(),

button_text:
$('adButtonText').value.trim()
|| 'اعرف المزيد',

button_url:
$('adButtonUrl').value.trim(),

active:
$('adActive').checked,

sort_order:
Number($('adSort').value || 0)

};

const file =
$('adImage').files[0];

if(file){

payload.image_url =
await uploadImage(file);

}

let r;

if(editingAd){

r =
await db
.from('ads')
.update(payload)
.eq('id',editingAd);

}else{

r =
await db
.from('ads')
.insert(payload);

}

if(r.error){

$('adMsg').textContent =
r.error.message;

return;

}

$('adMsg').textContent =
'تم حفظ الإعلان بنجاح';

resetAd();

loadAds();

}catch(e){

$('adMsg').textContent =
e.message;

}

};


async function loadAds(){

const r =
await db
.from('ads')
.select('*')
.order('sort_order')
.order('id',{ascending:false});

if(r.error){

$('adList').textContent =
r.error.message;

return;

}

ads =
r.data || [];

$('adList').innerHTML =
ads.map(ad=>`

<div class="item">

<div class="item-info">

${
ad.image_url
?
`
<img
class="item-image"
src="${esc(ad.image_url)}">
`
:''
}

<b>
${esc(ad.title)}
</b>

<br>

<small>
${ad.active?'فعال':'متوقف'}
</small>

</div>

<div class="item-actions">

<button
onclick="editAd(${ad.id})">
تعديل
</button>

<button
class="danger"
onclick="deleteAd(${ad.id})">
حذف
</button>

</div>

</div>

`).join('')
|| 'لا توجد إعلانات';

}


window.editAd =
id=>{

const ad =
ads.find(x=>x.id == id);

if(!ad){
return;
}

editingAd = id;

$('adTitle').textContent =
'تعديل الإعلان';

$('adName').value =
ad.title || '';

$('adDescription').value =
ad.description || '';

$('adButtonText').value =
ad.button_text || '';

$('adButtonUrl').value =
ad.button_url || '';

$('adSort').value =
ad.sort_order || 0;

$('adActive').checked =
!!ad.active;

$('cancelAd')
.classList.remove('hidden');

};


window.deleteAd =
async id=>{

if(!confirm('هل تريد حذف الإعلان؟')){
return;
}

const r =
await db
.from('ads')
.delete()
.eq('id',id);

if(r.error){

alert(r.error.message);

return;

}

loadAds();

};


function resetAd(){

editingAd = null;

$('adTitle').textContent =
'إضافة إعلان';

[
'adName',
'adDescription',
'adButtonText',
'adButtonUrl',
'adSort'
]
.forEach(id=>{
$(id).value = '';
});

$('adActive').checked = true;

$('adImage').value = '';

$('cancelAd')
.classList.add('hidden');

};


$('cancelAd').onclick =
resetAd;


/* حماية النصوص */

function esc(v){

return String(v ?? '')
.replace(
/[&<>"']/g,
m=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[m])
);

}


/* متابعة تسجيل الدخول */

db.auth.onAuthStateChange(
(_e,s)=>show(!!s)
);

init();

</script>

</body>

</html>
