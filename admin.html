<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة تحكم كتالوج بيت المرتب</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #172733;
      padding: 20px;
      font-size: 20px;
    }
    .hidden { display: none; }
    input, button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 18px;
    }
    #products div {
      background: #fff;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 0 4px #ccc;
    }
  </style>
</head>

<body>

  <h1>لوحة تحكم كتالوج بيت المرتب</h1>

  <!-- شاشة تسجيل الدخول -->
  <div id="login">
    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">
    <button id="loginBtn">تسجيل الدخول</button>
  </div>

  <!-- التطبيق بعد تسجيل الدخول -->
  <div id="app" class="hidden">
    <button id="logoutBtn">تسجيل الخروج</button>

    <h2>المنتجات</h2>
    <div id="products"></div>
  </div>

  <!-- تحميل إعدادات Supabase -->
  <script src="config.js"></script>

  <!-- تحميل مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script>
    // إنشاء عميل Supabase باستخدام config.js
    const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    // تسجيل الدخول
    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      const { data, error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        alert("خطأ: " + error.message);
      } else {
        showApp();
        loadProducts();
      }
    };

    // تسجيل الخروج
    document.getElementById("logoutBtn").onclick = async () => {
      await client.auth.signOut();
      hideApp();
    };

    // إظهار التطبيق
    function showApp() {
      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
    }

    // إخفاء التطبيق
    function hideApp() {
      document.getElementById("login").classList.remove("hidden");
      document.getElementById("app").classList.add("hidden");
    }

    // تحميل المنتجات من Supabase
    async function loadProducts() {
      const { data, error } = await client.from("products").select("*");

      if (error) {
        alert("خطأ في تحميل المنتجات: " + error.message);
        return;
      }

      const container = document.getElementById("products");
      container.innerHTML = data.map(p => `<div>${p.name}</div>`).join("");
    }
  </script>

</body>
</html>
