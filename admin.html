<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيت المراتب | لوحة التحكم</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#172238}header{background:#0d2a4a;color:#fff;padding:18px;font-size:22px;font-weight:bold}.wrap{max-width:1000px;margin:auto;padding:18px}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold}input,textarea,select{width:100%;padding:11px;margin-top:6px;border:1px solid #d8dee7;border-radius:9px;box-sizing:border-box}textarea{min-height:80px}button{padding:10px 15px;border:0;border-radius:9px;margin:12px 5px 0 0;font-weight:bold;cursor:pointer}.primary{background:#0d2a4a;color:#fff}.danger{background:#a83232;color:#fff}.muted{background:#e8edf3}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:9px;border-bottom:1px solid #eee;text-align:right}.thumb{width:55px;height:45px;object-fit:cover;border-radius:7px}.hidden{display:none}.status{padding:10px;background:#eef3f8;border-radius:10px;margin-bottom:12px}</style></head>
<body><header>لوحة تحكم كتالوج بيت المراتب</header><main class="wrap">
<section id="loginPanel" class="panel"><h2>تسجيل الدخول</h2><p>استخدم حساب Supabase الذي أنشأته لإدارة المنتجات.</p><div class="grid"><label>البريد الإلكتروني<input id="email" type="email"></label><label>كلمة المرور<input id="password" type="password"></label></div><button class="primary" onclick="login()">دخول</button><div id="loginMsg"></div></section>
<div id="app" class="hidden"><section class="panel"><div class="status">المستخدم: <span id="userEmail"></span> <button class="muted" onclick="logout()">تسجيل خروج</button></div><h2 id="title">إضافة منتج</h2><div class="grid"><label>الكود<input id="code"></label><label>الاسم<input id="name"></label><label>التصنيف<input id="category"></label><label>السعر<input id="price" type="number" step="0.01"></label><label>الحالة<select id="available"><option value="true">متوفر</option><option value="false">غير متوفر</option></select></label><label>ترتيب العرض<input id="sort_order" type="number" value="0"></label><label>الصورة<input id="file" type="file" accept="image/*"></label></div><label>الوصف<textarea id="description"></textarea></label><button class="primary" onclick="save()">حفظ المنتج</button><button class="muted" onclick="resetForm()">منتج جديد</button></section><section class="panel"><h2>المنتجات</h2><table><thead><tr><th>صورة</th><th>الكود</th><th>الاسم</th><th>السعر</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></section></div></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const {createClient}=supabase;const client=createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let products=[],editId=null,oldImage='';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function imageUrl(x){if(!x)return '';if(/^https?:\/\//i.test(x))return x;return client.storage.from('product-images').getPublicUrl(x).data.publicUrl}
async function login(){const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'';if(!error)showApp()}
async function logout(){await client.auth.signOut();location.reload()}
async function showApp(){const {data:{user}}=await client.auth.getUser();if(!user)return;$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=user.email;load()}
async function load(){const {data,error}=await client.from('products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error)return alert(error.message);products=data||[];render()}
function render(){rows.innerHTML=products.map(x=>`<tr><td>${x.image_url?`<img class="thumb" src="${esc(imageUrl(x.image_url))}">`:'-'}</td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.price)}</td><td>${x.available?'متوفر':'غير متوفر'}</td><td><button onclick="editP('${x.id}')">تعديل</button><button class="danger" onclick="del('${x.id}')">حذف</button></td></tr>`).join('')}
function resetForm(){editId=null;oldImage='';$('title').textContent='إضافة منتج';['code','name','category','price','description'].forEach(id=>$(id).value='');$('available').value='true';$('sort_order').value='0';$('file').value=''}
function editP(id){const x=products.find(p=>String(p.id)===String(id));if(!x)return;editId=x.id;oldImage=x.image_url||'';$('title').textContent='تعديل منتج';$('code').value=x.code||'';$('name').value=x.name||'';$('category').value=x.category||'';$('price').value=x.price??'';$('description').value=x.description||'';$('available').value=String(x.available!==false);$('sort_order').value=x.sort_order??0;scrollTo(0,0)}
async function save(){try{const {data:{user}}=await client.auth.getUser();if(!user)return alert('سجل الدخول أولاً');const code=$('code').value.trim(),name=$('name').value.trim();if(!code||!name)return alert('أدخل الكود والاسم');let image_url=oldImage;const f=$('file').files[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=`${code}-${Date.now()}.${ext}`;const up=await client.storage.from('product-images').upload(path,f,{upsert:true,contentType:f.type});if(up.error)throw up.error;image_url=path}const payload={code,name,category:$('category').value.trim(),description:$('description').value.trim(),price:$('price').value?Number($('price').value):null,image_url,available:$('available').value==='true',sort_order:Number($('sort_order').value||0)};let result;if(editId)result=await client.from('products').update(payload).eq('id',editId);else result=await client.from('products').insert(payload);if(result.error)throw result.error;alert('تم الحفظ بنجاح');resetForm();await load()}catch(e){console.error(e);alert(e.message||'حدث خطأ')}}
async function del(id){if(!confirm('حذف المنتج؟'))return;const x=products.find(p=>String(p.id)===String(id));const {error}=await client.from('products').delete().eq('id',id);if(error)return alert(error.message);if(x?.image_url&&!/^https?:\/\//i.test(x.image_url))await client.storage.from('product-images').remove([x.image_url]);await load()}
client.auth.getSession().then(({data})=>{if(data.session)showApp()});
</script></body></html>
