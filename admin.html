<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>لوحة تحكم شركة بيت المراتب للمفروشات</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f4f8fc;
margin:0;
color:#222;
}

.wrap{
max-width:1000px;
margin:auto;
padding:20px;
}

h1{
color:#0756a8;
}

.box{
background:#fff;
padding:20px;
border-radius:14px;
margin-bottom:18px;
box-shadow:0 2px 12px #0001;
}

input,textarea,button{
font:inherit;
padding:11px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

input,textarea{
width:100%;
margin:5px 0 10px;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
background:#0756a8;
color:#fff;
border:0;
margin:4px;
cursor:pointer;
}

.danger{
background:#b00020;
}

.green{
background:#159447;
}

.gray{
background:#666;
}

.hidden{
display:none;
}

.checkbox{
display:flex;
align-items:center;
gap:8px;
margin:10px 0;
}

.checkbox input{
width:auto;
margin:0;
}

.msg{
margin-top:10px;
font-weight:bold;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
border-top:1px solid #eee;
padding:12px 0;
}

.item-info{
flex:1;
}

.item-image{
width:70px;
height:55px;
object-fit:cover;
border-radius:7px;
margin-left:10px;
vertical-align:middle;
}

.item-actions{
white-space:nowrap;
}

.section-title{
color:#0756a8;
border-bottom:2px solid #e6edf5;
padding-bottom:10px;
}

</style>

</head>

<body>

<div class="wrap">

<h1>
لوحة تحكم شركة بيت المراتب للمفروشات
</h1>


<!-- تسجيل الدخول -->

<div id="login" class="box">

<h2>تسجيل الدخول</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني">

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button id="loginBtn">
دخول
</button>

<div
id="loginMsg"
class="msg">
</div>

</div>


<!-- لوحة التحكم -->

<div id="app" class="hidden">

<button id="logout">
تسجيل الخروج
</button>


<!-- =========================
     المنتجات
========================= -->

<div class="box">

<h2 class="section-title">
إدارة المنتجات
</h2>

<h3 id="productTitle">
إضافة منتج
</h3>

<input
id="code"
placeholder="كود المنتج">

<input
id="name"
placeholder="اسم المنتج">

<input
id="category"
placeholder="التصنيف">

<input
id="price"
type="number"
step="0.01"
placeholder="السعر">

<textarea
id="description"
placeholder="الوصف"></textarea>

<label class="checkbox">

<input
id="available"
type="checkbox"
checked>

متوفر

</label>

<input
id="sort"
type="number"
placeholder="الترتيب">

<input
id="image"
type="file"
accept="image/*">

<button id="saveProduct">
حفظ المنتج
</button>

<button
id="cancelProduct"
class="gray hidden">
إلغاء
</button>

<div
id="productMsg"
class="msg">
</div>

</div>


<!-- قائمة المنتجات -->

<div class="box">

<h2 class="section-title">
المنتجات الحالية
</h2>

<div id="productList">
جاري التحميل...
</div>

</div>


<!-- =========================
     الإعلانات
========================= -->

<div class="box">

<h2 class="section-title">
إدارة الإعلانات
</h2>

<h3 id="adTitle">
إضافة إعلان
</h3>

<input
id="adName"
placeholder="عنوان الإعلان">

<textarea
id="adDescription"
placeholder="وصف الإعلان"></textarea>

<input
id="adButtonText"
placeholder="نص الزر مثال: تواصل معنا">

<input
id="adButtonUrl"
placeholder="رابط الزر">

<input
id="adSort"
type="number"
placeholder="الترتيب">

<label class="checkbox">

<input
id="adActive"
type="checkbox"
checked>

الإعلان فعال

</label>

<input
id="adImage"
type="file"
accept="image/*">

<button
id="saveAd"
class="green">
حفظ الإعلان
</button>

<button
id="cancelAd"
class="gray hidden">
إلغاء
</button>

<div
id="adMsg"
class="msg">
</div>

</div>


<!-- قائمة الإعلانات -->

<div class="box">

<h2 class="section-title">
الإعلانات الحالية
</h2>

<div id="adList">
جاري التحميل...
</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

/* =========================
   الاتصال بـ Supabase
========================= */

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let editingProduct = null;
let editingAd = null;

let products = [];
let ads = [];


const $ =
id => document.getElementById(id);


/* =========================
   تسجيل الدخول
========================= */

async function init(){

const r =
await db.auth.getSession();

show(!!r.data.session);

if(r.data.session){

await loadProducts();

await loadAds();

}

}


function show(on){

$('login')
.classList.toggle(
'hidden',
on
);

$('app')
.classList.toggle(
'hidden',
!on
);

}


$('loginBtn').onclick =
async()=>{

const email =
$('email').value.trim();

const password =
$('password').value;

$('loginMsg').textContent =
'جاري تسجيل الدخول...';

try{

const result =
await db.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

$('loginMsg').textContent =
'خطأ: ' +
result.error.message;

console.error(
result.error
);

return;

}


$('loginMsg').textContent =
'تم تسجيل الدخول';

show(true);

await loadProducts();

await loadAds();


}catch(e){

$('loginMsg').textContent =
'خطأ: ' +
e.message;

console.error(e);

}

};


$('logout').onclick =
async()=>{

await db.auth.signOut();

show(false);

};


/* =========================
   رفع الصور
========================= */

async function uploadImage(file){

if(!file){

return null;

}


const ext =
(
file.name
.split('.')
.pop()
||
'jpg'
)
.toLowerCase();


const path =
crypto.randomUUID()
+
'.'
+
ext;


const result =
await db.storage
.from('product-images')
.upload(
path,
file,
{
upsert:false
}
);


if(result.error){

throw result.error;

}


const url =
db.storage
.from('product-images')
.getPublicUrl(path);


return url.data.publicUrl;

}


/* =========================
   حفظ المنتج
========================= */

$('saveProduct').onclick =
async()=>{

$('productMsg').textContent =
'جاري حفظ المنتج...';


try{

const payload = {

code:
$('code').value.trim(),

name:
$('name').value.trim(),

category:
$('category').value.trim(),

description:
$('description').value.trim(),

price:
$('price').value
?
Number($('price').value)
:
null,

available:
$('available').checked,

sort_order:
Number(
$('sort').value || 0
)

};


if(!payload.name){

$('productMsg').textContent =
'اكتب اسم المنتج أولاً';

return;

}


const file =
$('image').files[0];


if(file){

$('productMsg').textContent =
'جاري رفع الصورة...';

payload.image_url =
await uploadImage(file);

}


/* تعديل */

if(editingProduct){

const result =
await db
.from('products')
.update(payload)
.eq(
'id',
editingProduct
)
.select();


console.log(
'UPDATE RESULT:',
result
);


if(result.error){

$('productMsg').textContent =
'خطأ: ' +
result.error.message;

console.error(
result.error
);

return;

}


$('productMsg').textContent =
'تم تعديل المنتج بنجاح';


resetProduct();

await loadProducts();

return;

}


/* إضافة منتج */

const result =
await db
.from('products')
.insert([payload])
.select();


console.log(
'INSERT PRODUCT RESULT:',
result
);


if(result.error){

$('productMsg').textContent =
'خطأ: ' +
result.error.message;

console.error(
result.error
);

return;

}


if(!result.data ||
result.data.length === 0){

$('productMsg').textContent =
'لم يتم إنشاء المنتج';

return;

}


$('productMsg').textContent =
'تم حفظ المنتج بنجاح';


resetProduct();

await loadProducts();


}catch(e){

console.error(e);

$('productMsg').textContent =
'خطأ: ' +
e.message;

}

};


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

const result =
await db
.from('products')
.select('*')
.order(
'sort_order',
{
ascending:true
}
)
.order(
'name',
{
ascending:true
}
);


console.log(
'LOAD PRODUCTS:',
result
);


if(result.error){

$('productList').textContent =
result.error.message;

console.error(
result.error
);

return;

}


products =
result.data || [];


if(!products.length){

$('productList').innerHTML =
'لا توجد منتجات';

return;

}


$('productList').innerHTML =
products
.map(p=>`

<div class="item">

<div class="item-info">

${
p.image_url
?

`
<img
class="item-image"
src="${esc(p.image_url)}"
alt="${esc(p.name)}">
`

:

''
}

<b>
${esc(p.name)}
</b>

<br>

<small>

الكود:
${esc(p.code || '-')}

<br>

التصنيف:
${esc(p.category || '-')}

<br>

السعر:
${p.price ?? '-'} ريال

<br>

الحالة:
${p.available
?
'متوفر'
:
'غير متوفر'}

</small>

</div>


<div class="item-actions">

<button
onclick="editProduct(${p.id})">
تعديل
</button>

<button
class="danger"
onclick="deleteProduct(${p.id})">
حذف
</button>

</div>

</div>

`)
.join('');

}


/* =========================
   تعديل المنتج
========================= */

window.editProduct =
id=>{

const p =
products.find(
x=>x.id == id
);


if(!p){

return;

}


editingProduct =
id;


$('productTitle').textContent =
'تعديل المنتج';


$('code').value =
p.code || '';

$('name').value =
p.name || '';

$('category').value =
p.category || '';

$('price').value =
p.price ?? '';

$('description').value =
p.description || '';

$('available').checked =
!!p.available;

$('sort').value =
p.sort_order || 0;


$('cancelProduct')
.classList.remove(
'hidden'
);

window.scrollTo({
top:0,
behavior:'smooth'
});

};


/* =========================
   حذف المنتج
========================= */

window.deleteProduct =
async id=>{

if(
!confirm(
'هل تريد حذف المنتج؟'
)
){

return;

}


const result =
await db
.from('products')
.delete()
.eq('id',id);


if(result.error){

alert(
result.error.message
);

return;

}


await loadProducts();

};


/* =========================
   إعادة نموذج المنتج
========================= */

function resetProduct(){

editingProduct =
null;


$('productTitle').textContent =
'إضافة منتج';


$('code').value = '';

$('name').value = '';

$('category').value = '';

$('price').value = '';

$('description').value = '';

$('sort').value = '';

$('available').checked =
true;

$('image').value = '';


$('cancelProduct')
.classList.add(
'hidden'
);

}


$('cancelProduct').onclick =
resetProduct;


/* =========================
   حفظ الإعلان
========================= */

$('saveAd').onclick =
async()=>{

$('adMsg').textContent =
'جاري حفظ الإعلان...';


try{

const payload = {

title:
$('adName').value.trim(),

description:
$('adDescription').value.trim(),

button_text:
$('adButtonText').value.trim()
||
'اعرف المزيد',

button_url:
$('adButtonUrl').value.trim(),

active:
$('adActive').checked,

sort_order:
Number(
$('adSort').value || 0
)

};


if(!payload.title){

$('adMsg').textContent =
'اكتب عنوان الإعلان أولاً';

return;

}


const file =
$('adImage').files[0];


if(file){

$('adMsg').textContent =
'جاري رفع صورة الإعلان...';

payload.image_url =
await uploadImage(file);

}


let result;


/* تعديل إعلان */

if(editingAd){

result =
await db
.from('ads')
.update(payload)
.eq(
'id',
editingAd
)
.select();


}else{

/* إضافة إعلان */

result =
await db
.from('ads')
.insert([payload])
.select();

}


console.log(
'AD RESULT:',
result
);


if(result.error){

$('adMsg').textContent =
'خطأ: ' +
result.error.message;

console.error(
result.error
);

return;

}


if(!result.data ||
result.data.length === 0){

$('adMsg').textContent =
'لم يتم حفظ الإعلان';

return;

}


$('adMsg').textContent =
'تم حفظ الإعلان بنجاح';


resetAd();

await loadAds();


}catch(e){

console.error(e);

$('adMsg').textContent =
'خطأ: ' +
e.message;

}

};


/* =========================
   تحميل الإعلانات
========================= */

async function loadAds(){

const result =
await db
.from('ads')
.select('*')
.order(
'sort_order',
{
ascending:true
}
)
.order(
'id',
{
ascending:false
}
);


console.log(
'LOAD ADS:',
result
);


if(result.error){

$('adList').textContent =
result.error.message;

console.error(
result.error
);

return;

}


ads =
result.data || [];


if(!ads.length){

$('adList').innerHTML =
'لا توجد إعلانات';

return;

}


$('adList').innerHTML =
ads
.map(ad=>`

<div class="item">

<div class="item-info">

${
ad.image_url
?

`
<img
class="item-image"
src="${esc(ad.image_url)}"
alt="${esc(ad.title)}">
`

:

''
}

<b>
${esc(ad.title)}
</b>

<br>

<small>

الحالة:
${ad.active
?
'فعال'
:
'متوقف'}

<br>

الترتيب:
${ad.sort_order || 0}

</small>

</div>


<div class="item-actions">

<button
onclick="editAd(${ad.id})">
تعديل
</button>

<button
class="danger"
onclick="deleteAd(${ad.id})">
حذف
</button>

</div>

</div>

`)
.join('');

}


/* =========================
   تعديل الإعلان
========================= */

window.editAd =
id=>{

const ad =
ads.find(
x=>x.id == id
);


if(!ad){

return;

}


editingAd =
id;


$('adTitle').textContent =
'تعديل الإعلان';


$('adName').value =
ad.title || '';

$('adDescription').value =
ad.description || '';

$('adButtonText').value =
ad.button_text || '';

$('adButtonUrl').value =
ad.button_url || '';

$('adSort').value =
ad.sort_order || 0;

$('adActive').checked =
!!ad.active;


$('cancelAd')
.classList.remove(
'hidden'
);

};


/* =========================
   حذف الإعلان
========================= */

window.deleteAd =
async id=>{

if(
!confirm(
'هل تريد حذف الإعلان؟'
)
){

return;

}


const result =
await db
.from('ads')
.delete()
.eq('id',id);


if(result.error){

alert(
result.error.message
);

return;

}


await loadAds();

};


/* =========================
   إعادة نموذج الإعلان
========================= */

function resetAd(){

editingAd =
null;


$('adTitle').textContent =
'إضافة إعلان';


$('adName').value = '';

$('adDescription').value = '';

$('adButtonText').value = '';

$('adButtonUrl').value = '';

$('adSort').value = '';

$('adActive').checked =
true;

$('adImage').value = '';


$('cancelAd')
.classList.add(
'hidden'
);

}


$('cancelAd').onclick =
resetAd;


/* =========================
   حماية النصوص
========================= */

function esc(v){

return String(
v ?? ''
)
.replace(
/[&<>"']/g,
m=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[m])
);

}


/* =========================
   متابعة تسجيل الدخول
========================= */

db.auth.onAuthStateChange(
(_event,session)=>{

show(
!!session
);

}
);


/* تشغيل الصفحة */

init();

</script>

</body>

</html>
